<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Food Shelf Life Tracker - Login</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="auth-container" id="auth-box">
    <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" alt="Food Storage">
    <h1>FoodTracker</h1>
    <p><strong>Smart Food Shelf Life Management with IoT</strong></p>

    <div th:if="${registered}" class="msg">Registration successful! Please login.</div>
    <div th:if="${loginError}" class="err">Invalid credentials. Please try again.</div>
    <div th:if="${registerError}" class="err" th:text="${registerError}"></div>

    <div id="auth-buttons">
      <button class="btn" onclick="showForm('login')">Login</button>
      <button class="btn" onclick="showForm('register')">Register</button>
    </div>

    <!-- Login Form (posts to /login) -->
    <div class="form-box" id="login-form">
      <h2>Login</h2>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group"><label>Email</label><input type="email" name="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="form-btn" type="submit">Login</button>
      </form>
      <span class="back-btn" onclick="goBack()">← Back</span>
    </div>

    <!-- Register Form -->
    <div class="form-box" id="register-form">
      <h2>Register</h2>
      <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="form-btn" type="submit">Register</button>
      </form>
      <span class="back-btn" onclick="goBack()">← Back</span>
    </div>
  </div>

  <script>
    function showForm(type){
      document.getElementById("auth-buttons").style.display="none";
      document.getElementById("login-form").style.display="none";
      document.getElementById("register-form").style.display="none";
      document.getElementById(type+"-form").style.display="block";
    }
    function goBack(){
      document.getElementById("auth-buttons").style.display="block";
      document.getElementById("login-form").style.display="none";
      document.getElementById("register-form").style.display="none";
    }
  </script>
</body>
</html>
